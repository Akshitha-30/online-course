# Maven Build Pipeline
# Builds and tests your Java project using Apache Maven.

trigger:
- main

pool:
  name: ak  

steps:
- script: |
    echo "JAVA_HOME=%JAVA_HOME%"
    java -version
    mvn -version
  displayName: 'Verify Java and Maven installation' 

- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'Path'
    jdkDirectory: 'C:\Program Files\jdk-21.0.8\bin'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'compile'
